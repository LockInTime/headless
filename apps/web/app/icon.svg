<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!--
    Browser-tab icon: the same viewfinder geometry as public/headless-mark.svg
    and tools/make-icon.swift, but on the app icon's dark squircle.

    The bare mark cannot be the favicon: it is stroke-only and takes its colour
    from a prefers-color-scheme block, which browsers do not reliably re-evaluate
    for tab icons, so the near-black stroke disappears on dark tab strips. The
    squircle carries its own background and reads on any surface.
  -->
  <defs>
    <linearGradient id="headless-icon-canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c24" />
      <stop offset="1" stop-color="#050508" />
    </linearGradient>
  </defs>
  <rect x="6.25" y="6.25" width="51.5" height="51.5" rx="11.625" fill="url(#headless-icon-canvas)" />
  <rect
    x="6.25" y="6.25" width="51.5" height="51.5" rx="11.625"
    fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.375"
  />
  <path
    d="M18.875 26.75V18.875H26.75M37.25 18.875H45.125V26.75M45.125 37.25V45.125H37.25M26.75 45.125H18.875V37.25"
    stroke="#f5f5f2"
    stroke-width="2.875"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
