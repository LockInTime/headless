<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Region capture fixture</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: rgb(220, 20, 60); font: 16px sans-serif; }
    main { padding: 120px 40px 240px; }
    section {
      box-sizing: border-box;
      width: 640px;
      height: 1600px;
      padding: 32px;
      overflow: hidden;
      background: rgb(0, 180, 190);
      color: rgb(5, 35, 40);
    }
  </style>
</head>
<body>
  <main>
    <section aria-label="Capture target">
      <h1>Capture target</h1>
      <p>The red page background must not appear in region artifacts.</p>
    </section>
  </main>
</body>
</html>
