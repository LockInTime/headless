<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in to Fixture</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form id="login" method="post" aria-label="Sign in">
        <label
          >Email <input type="email" autocomplete="username" aria-label="Email"
        /></label>
        <label
          >Password
          <input
            type="password"
            autocomplete="current-password"
            aria-label="Password"
        /></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="status">Signed out</p>
    </main>
    <script>
      document.querySelector("#login").addEventListener("submit", (event) => {
        event.preventDefault();
        const email = document.querySelector('[autocomplete="username"]').value;
        const password = document.querySelector(
          '[autocomplete="current-password"]',
        ).value;
        if (
          email === "fixture@example.test" &&
          password === "synthetic-direct-password"
        ) {
          document.querySelector("#login").remove();
          document.querySelector("#status").textContent = "Signed in";
        } else {
          document.querySelector("#status").textContent = "Login failed";
        }
      });
    </script>
  </body>
</html>
