[package]
name = "headless-protocol"
version = "0.5.0"
edition = "2021"
description = "Rust port of the Headless shared protocol core (ADR #21)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
