version: 2

updates:
  # One npm entry for the whole pnpm workspace. It must point at the root:
  # apps/web and apps/headless share a single pnpm-lock.yaml there, and an
  # entry aimed at a workspace member updates only that member's
  # package.json, leaving the root lockfile stale and every CI job failing
  # on --frozen-lockfile.
  #
  # The Swift package has zero third-party dependencies by design, so there
  # is nothing to update for it — see docs/roadmap/what-is-excellent.md §11.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "type:chore"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      types:
        patterns: ["@types/*"]
      eslint:
        patterns: ["eslint", "@eslint/*"]
    # eslint-config-next 16's bundled React/import/a11y plugins still declare
    # ESLint 9 peer ranges and fail at runtime on ESLint 10. Remove this when
    # the follow-up compatibility issue is closed.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7.0 has no compiler API, so eslint-config-next and
      # typescript-eslint cannot use it. TypeScript 7.1 will restore an API.
      - dependency-name: typescript
        versions: [">=7.0.0 <7.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - "type:ci"

  - package-ecosystem: docker
    directory: /apps/headless
    schedule:
      interval: monthly
    labels:
      - "type:ci"
      - "area:build-release"
