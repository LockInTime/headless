version: 2

updates:
  # The Swift package has zero third-party dependencies by design, so there is
  # nothing to update there — see docs/roadmap/what-is-excellent.md §11.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "type:chore"
      - "area:web"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      types:
        patterns: ["@types/*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - "type:chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - "type:ci"

  - package-ecosystem: docker
    directory: /apps/headless
    schedule:
      interval: monthly
    labels:
      - "type:ci"
      - "area:build-release"
